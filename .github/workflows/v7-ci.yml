name: BOKAN ERP V7 CI

on:
  push:
    branches:
      - rebuild/bokan-erp-v7
  pull_request:
    branches:
      - rebuild/bokan-erp-v7

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out V7 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests and production build
        run: npm run build
