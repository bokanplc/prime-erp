name: BOKAN ERP V7 CI

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/bokan-erp-v7
  pull_request:
    branches:
      - rebuild/bokan-erp-v7

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out V7 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Report dependency security advisories
        run: |
          npm audit --json > .npm-audit.json || true
          node -e 'const a=require("./.npm-audit.json"); const v=a.metadata?.vulnerabilities; if (!v) { console.error("Dependency audit did not return a valid report."); process.exit(2); } console.log("Dependency audit summary:", JSON.stringify(v)); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ": " + item.severity + "; direct=" + item.isDirect + "; range=" + item.range + "; fix=" + JSON.stringify(item.fixAvailable)); if ((v.high ?? 0) > 0 || (v.critical ?? 0) > 0) { console.error("Blocking high or critical dependency vulnerabilities remain."); process.exit(1); }'

      - name: Lint
        run: npm run lint

      - name: Verify isolation, migrations, tests and production build
        run: npm run build

  database-migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bokan_v7_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bokan_v7_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
    steps:
      - name: Check out V7 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Copy SQL test suite into disposable PostgreSQL container
        run: |
          docker cp scripts/v7-postgres-bootstrap.sql "$POSTGRES_CONTAINER_ID":/tmp/v7-postgres-bootstrap.sql
          docker cp supabase/migrations "$POSTGRES_CONTAINER_ID":/tmp/v7-migrations
          docker cp scripts/test-v7-postgres-rls.sql "$POSTGRES_CONTAINER_ID":/tmp/test-v7-postgres-rls.sql

      - name: Create disposable Supabase Auth stand-in
        run: docker exec "$POSTGRES_CONTAINER_ID" psql -X -U postgres -d bokan_v7_test -v ON_ERROR_STOP=1 -f /tmp/v7-postgres-bootstrap.sql

      - name: Apply only the V7 database migrations
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" sh -lc 'for migration in /tmp/v7-migrations/*.sql; do echo "Applying $migration"; psql -X -U postgres -d bokan_v7_test -v ON_ERROR_STOP=1 -f "$migration"; done'

      - name: Verify RLS, company isolation and deferred modules
        run: docker exec "$POSTGRES_CONTAINER_ID" psql -X -U postgres -d bokan_v7_test -v ON_ERROR_STOP=1 -f /tmp/test-v7-postgres-rls.sql
