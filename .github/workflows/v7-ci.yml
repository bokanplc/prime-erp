name: BOKAN ERP V7 CI

on:
  push:
    branches:
      - rebuild/bokan-erp-v7
  pull_request:
    branches:
      - rebuild/bokan-erp-v7

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out V7 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Report dependency security advisories
        run: |
          npm audit --json > .npm-audit.json || true
          node -e 'const a=require("./.npm-audit.json"); console.log("Dependency audit summary:", JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, v] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ": " + v.severity + "; direct=" + v.isDirect + "; range=" + v.range + "; fix=" + JSON.stringify(v.fixAvailable));'

      - name: Lint
        run: npm run lint

      - name: Verify isolation, migrations, tests and production build
        run: npm run build

  database-migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bokan_v7_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bokan_v7_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bokan_v7_test
    steps:
      - name: Check out V7 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create disposable Supabase Auth stand-in
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/v7-postgres-bootstrap.sql

      - name: Apply only the V7 database migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -X -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Verify RLS, company isolation and deferred modules
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/test-v7-postgres-rls.sql
