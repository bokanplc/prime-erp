name: ERP source safety checks

on:
  push:
    branches:
      - deploy/secure-staging
    paths:
      - 'staging/**'
      - 'scripts/**'
      - 'docs/CORE_PROFORMA_MVP_SCHEMA_DRAFT.sql'
      - '.github/workflows/erp-source-guards.yml'
  pull_request:
    paths:
      - 'staging/**'
      - 'scripts/**'
      - 'docs/CORE_PROFORMA_MVP_SCHEMA_DRAFT.sql'
      - '.github/workflows/erp-source-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test startup and staging guards
        run: node scripts/test-erp-source-guards.mjs
      - name: Test core proforma schema draft
        run: node scripts/test-core-schema-draft.mjs
      - name: Test Proforma UI and database contract
        run: node scripts/test-proforma-ui-contract.mjs
      - name: Test actual Proforma calculation helper
        run: node scripts/test-proforma-math.mjs
      - name: Parse inline JavaScript
        run: node scripts/check-inline-js.mjs
      - name: Audit direct data-access surface
        run: node scripts/audit-erp-data-surface.mjs
      - name: Audit full ERP release readiness (stop-ship report)
        run: node scripts/audit-erp-release-readiness.mjs
      - name: Test full ERP release gate rejects premature enablement
        run: node scripts/test-erp-release-readiness.mjs
      - name: Build sanitized release candidate
        run: node scripts/build-release-candidate.mjs
      - name: Test sanitized release candidate
        run: node scripts/test-release-candidate.mjs

  postgres-schema-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bokan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bokan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply draft to disposable PostgreSQL and test RLS and totals
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: bokan_test
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/test-core-proforma-postgres.sql
      - name: Test concurrent proforma numbering
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: bokan_test
        run: bash scripts/test-core-proforma-concurrency.sh
